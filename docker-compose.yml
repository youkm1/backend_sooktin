services:
  app:
    build: .
    network_mode: "host"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - AWS_DEFAULT_REGION=ap-northeast-2
      - SPRING_DATA_REDIS_HOST=master.sooktin-redis.dvwzww.apn2.cache.amazonaws.com
      - JAVA_TOOL_OPTIONS=-XX:-UseContainerSupport
    depends_on:
      - rabbitmq
      
  rabbitmq:
    image: rabbitmq:3-management
    network_mode: "host"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    command: >
      sh -c "
        rabbitmq-plugins enable rabbitmq_stomp rabbitmq_web_stomp &&
        rabbitmq-server
      "
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  nginx:
    image: nginx:latest
    network_mode: host
    volumes:
      - ./nginx-default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
      
  prometheus:
    image: prom/prometheus:latest
    network_mode: "host"  # host 모드로 localhost 통신 가능
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.listen-address=0.0.0.0:9090'  # 포트 명시
    restart: unless-stopped

  # Grafana - 대시보드
  grafana:
    image: grafana/grafana:latest
    network_mode: "host"  # host 모드로 prometheus 접근 가능
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # EC2 의 ~/app/.env 에서 읽는다. 값이 없으면 compose 가 기동을 거부한다.
      # (빈 비밀번호로 조용히 뜨는 것보다 배포가 실패하는 편이 안전하다)
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?~/app/.env 에 GRAFANA_ADMIN_PASSWORD 를 설정하세요}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=3000
      - GF_SERVER_ROOT_URL=https://sooktin.duckdns.org/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
