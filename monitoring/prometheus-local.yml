global:
  scrape_interval: 5s      # 부하 테스트가 1분이라 prod(15s)보다 촘촘하게 본다
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 앱은 컨테이너가 아니라 호스트에서 gradlew 로 뜨므로 host.docker.internal 로 잡는다.
  # prod 는 EC2 한 대에 앱까지 올라가 host 네트워킹으로 localhost:8080 을 쓴다.
  - job_name: 'sooktin-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
    scrape_interval: 5s
    scrape_timeout: 4s
