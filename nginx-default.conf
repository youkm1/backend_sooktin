server {
    listen 443 ssl;
    server_name sooktin.duckdns.org;

    # SSL 설정
    ssl_certificate /etc/letsencrypt/live/sooktin.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sooktin.duckdns.org/privkey.pem;
    
    # Grafana 접근 (보안 강화 권장)
    location /grafana/ {
        proxy_pass http://localhost:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 지원
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Prometheus 접근 (내부용 - IP 제한 권장)
    location /prometheus/ {
        proxy_pass http://localhost:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # IP 제한 (활성 상태). 외부에서는 접근할 수 없고,
        # 확인이 필요하면 SSH 터널을 쓴다: ssh -L 9090:localhost:9090 ubuntu@<EC2>
        # 프로메테우스는 자체 인증이 없으므로 이 블록을 지우면 전체 메트릭이 공개된다.
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
    }


    # 불필요한 PHP 관련 요청 차단 (공격 시도 차단)
    location ~* (\.php$|/index.php|/think|/public/index.php|/vendor|/runtime) {
        return 403;
    }

    # 민감한 경로 차단 (phpMyAdmin, WP Admin 등)
    location ~* (/phpmyadmin|/admin|/wp-admin|/wp-login.php) {
        return 403;
    }

    # SQL Injection 및 XSS 공격 차단
    location ~* "(select|union|insert|delete|update|drop|alter|create|exec|cast|declare|sleep|benchmark)" {
        return 403;
    }


    location / {
        proxy_pass http://localhost:8080;   #hostmodeon!
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 리다이렉션 방지
        proxy_redirect off;

        # HTTP 메서드 보존
        proxy_method $request_method;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;

        # CORS 설정 - 특정 오리진만 허용 -> Spring Security와의 충돌 해결
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # 로그 설정 (보안 및 디버깅 목적)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}

server {
    listen 80;
    server_name sooktin.duckdns.org;
    return 301 https://$server_name$request_uri;
}
