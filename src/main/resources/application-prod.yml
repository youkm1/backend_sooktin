spring:
  application:
    name: sooktin
  async:
    email:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 50
  config:
    import: aws-parameterstore:/sooktin/prod/
  datasource:
    url: ${db.url}
    username: ${db.username}
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false
  rabbitmq:
    host: localhost
    username: guest
    password: guest
    port: 5672
  security:
    user:
      name: ${security.user.name}
      password: ${security.user.password}
      roles: ADMIN
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${smtp.username}
    password: ${smtp.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          timeout: 5000
          connectiontimeout: 5000
  # 채팅 설정 추가
  chat:
    queue:
      name: chat.queue
  data:  # ← 이 부분이 spring: 하위로 들여쓰기 되어야 함
    redis:
      host: master.sooktin-redis.dvwzww.apn2.cache.amazonaws.com
      port: 6379
      timeout: 10000ms  # ← 단위 명시
      ssl:
        enabled: false

# prometheus.yml 이 /actuator/prometheus 를 스크레이프한다.
# 이 블록이 없으면 Spring Boot 기본값(health 만 노출)이라 스크레이프가 404 로 실패한다.
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
